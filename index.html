<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تحكيم الكاراتيه">
<title>تحكيم الكاراتيه</title>
<style>
button{font-family:inherit;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input{font-family:inherit}
*{-webkit-tap-highlight-color:transparent}
:root { --km-aka: #d32f2f; --km-ao: #1565c0; --km-tx: #16181d; --km-bd: #d9dce2; --km-mut: #6b7280; --km-bg: #f4f4f6; }
.km-board { display: flex; flex-direction: column; gap: 8px; }
.km-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.km-tab { flex: 1; font-size: 15px; font-weight: 600; padding: 8px 4px; border: 1px solid var(--km-bd); background: #fff; color: var(--km-tx); border-radius: 10px; }
.km-seg { display: flex; gap: 6px; }
.km-segbtn { flex: 1; padding: 8px 4px; border: 1px solid var(--km-bd); background: #fff; color: var(--km-tx); border-radius: 10px; font-weight: 600; }
.km-seg-on { background: var(--km-tx) !important; color: #fff !important; border-color: var(--km-tx) !important; }
.km-timercard { text-align: center; background: #fff; border: 1px solid var(--km-bd); border-radius: 14px; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
.km-clock { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 2px; color: var(--km-tx); line-height: 1.2; }
.km-clock-low { color: #e53935 !important; }
.km-dark { flex: 1; border: 1px solid var(--km-tx); background: var(--km-tx); color: #fff; border-radius: 10px; padding: 9px 4px; font-size: 14px; font-weight: 600; }
.km-dark:disabled { opacity: 0.4; }
.km-row { display: flex; gap: 8px; }
.km-row > * { flex: 1; }
.km-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.km-panel { min-width: 0; display: flex; flex-direction: column; padding: 8px; border-radius: 14px; border: 2px solid; background: #fff; text-align: center; }
.km-panel-aka { border-color: var(--km-aka); }
.km-panel-ao { border-color: var(--km-ao); }
.km-pname { color: #fff; border-radius: 8px; padding: 4px; font-weight: 700; letter-spacing: 1px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.km-pname-aka { background: var(--km-aka); }
.km-pname-ao { background: var(--km-ao); }
.km-score { font-size: 50px; font-weight: 800; line-height: 1.1; }
.km-score-aka, .km-txt-aka { color: var(--km-aka); }
.km-score-ao, .km-txt-ao { color: var(--km-ao); }
.km-senshu { width: 100%; margin-top: 4px; border: 1px solid; background: #fff; border-radius: 10px; padding: 7px 4px; font-size: 14px; font-weight: 600; }
.km-panel-aka .km-senshu { border-color: var(--km-aka); color: var(--km-aka); }
.km-panel-ao .km-senshu { border-color: var(--km-ao); color: var(--km-ao); }
.km-on-aka { background: var(--km-aka) !important; border-color: var(--km-aka) !important; color: #fff !important; }
.km-on-ao { background: var(--km-ao) !important; border-color: var(--km-ao) !important; color: #fff !important; }
.km-stats { display: flex; gap: 4px; margin: 6px 0 2px; }
.km-stat { flex: 1; background: var(--km-bg); border: none; border-radius: 8px; padding: 4px 0; display: flex; flex-direction: column; align-items: center; }
.km-cnum { font-size: 17px; line-height: 1.2; }
.km-clabel { font-size: 11px; color: var(--km-mut); }
.km-add { width: 100%; margin-top: 4px; border: none; border-radius: 10px; padding: 12px 4px; font-size: 15px; font-weight: 700; color: #fff; }
.km-add-aka { background: var(--km-aka); }
.km-add-ao { background: var(--km-ao); }
.km-warn { border: 1px solid; background: #fff; border-radius: 10px; padding: 9px 4px; font-size: 14px; font-weight: 600; color: var(--km-tx); }
.km-panel-aka .km-warn { border-color: var(--km-aka); }
.km-panel-ao .km-warn { border-color: var(--km-ao); }
.km-minus { flex: 0 0 42px; border: 1px solid var(--km-bd); background: #fff; border-radius: 10px; font-size: 16px; font-weight: 700; color: var(--km-tx); }
.km-chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; justify-content: center; }
.km-chip { font-size: 11px; padding: 5px 6px; border-radius: 6px; border: 1px dashed var(--km-bd); background: #fff; color: var(--km-mut); }
.km-chip.km-on-aka, .km-chip.km-on-ao { border-style: solid; font-weight: 700; }
.km-endbar { color: #fff; text-align: center; border-radius: 14px; padding: 12px; font-size: 20px; font-weight: 800; }
.km-endbar small { display: block; font-size: 13px; font-weight: 500; opacity: 0.9; margin-top: 4px; }
.km-btn { border: 1px solid var(--km-bd); border-radius: 10px; padding: 9px 10px; font-size: 13px; font-weight: 600; background: #fff; color: var(--km-tx); }
.km-btn:disabled { opacity: 0.4; }
.km-go { background: #2e7d32; color: #fff; border-color: #2e7d32; }
.km-stop { background: #c62828; color: #fff; border-color: #c62828; }
.km-confirm { background: #b3541e; color: #fff; border-color: #b3541e; }
.km-bottom { display: flex; gap: 6px; margin-top: 8px; padding-bottom: env(safe-area-inset-bottom); }
.km-bottom .km-btn { flex: 1; }
.km-next { width: 100%; background: #2e7d32; color: #fff; border-color: #2e7d32; font-size: 15px; padding: 11px; }
.km-hint { color: var(--km-mut); font-size: 11px; text-align: center; margin-top: 6px; line-height: 1.6; }
.km-teamstrip { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; padding: 6px 8px; border: 1px solid var(--km-bd); border-radius: 12px; background: #fff; }
.km-tcell { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.km-tname { font-size: 11px; font-weight: 600; max-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.km-twin { font-size: 30px; line-height: 1; }
.km-tpts { font-size: 10px; color: var(--km-mut); }
.km-tmid { font-size: 13px; font-weight: 700; color: var(--km-tx); text-align: center; }
.km-histhead { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 10px 0; }
.km-histtitle { font-weight: 800; font-size: 15px; color: var(--km-tx); margin: 8px 2px; }
.km-empty { color: var(--km-mut); font-size: 13px; text-align: center; padding: 16px 0; border: 1px solid var(--km-bd); border-radius: 12px; margin-top: 8px; }
.km-card { border: 1px solid var(--km-bd); border-radius: 14px; padding: 10px; margin-top: 8px; background: #fff; }
.km-cardhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.km-date { font-size: 12px; color: var(--km-mut); }
.km-badge { font-size: 12px; font-weight: 700; color: #fff; border-radius: 20px; padding: 2px 10px; }
.km-badge-aka { background: var(--km-aka); }
.km-badge-ao { background: var(--km-ao); }
.km-badge-draw { background: #666; }
.km-sb { display: flex; align-items: center; gap: 6px; }
.km-sk { flex: 1; text-align: center; border: 2px solid; border-radius: 10px; padding: 6px 2px; }
.km-sk-aka { border-color: var(--km-aka); color: var(--km-aka); }
.km-sk-ao { border-color: var(--km-ao); color: var(--km-ao); }
.km-sk-win.km-sk-aka { background: var(--km-aka); color: #fff; }
.km-sk-win.km-sk-ao { background: var(--km-ao); color: #fff; }
.km-sk i { display: block; font-style: normal; font-weight: 700; font-size: 13px; }
.km-sk b { display: block; font-size: 34px; line-height: 1.1; }
.km-sk em { display: block; font-style: normal; font-size: 11px; font-weight: 700; }
.km-dash { color: var(--km-mut); font-weight: 700; }
.km-cardscore { display: flex; justify-content: center; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.km-big { font-size: 26px; font-weight: 700; color: var(--km-tx); }
.km-table { margin-top: 8px; }
.km-tr { display: flex; justify-content: space-between; padding: 5px 3px; font-size: 13px; border-top: 1px solid var(--km-bd); }
.km-tr span { flex: 1; text-align: center; color: var(--km-tx); }
.km-tr span:first-child { text-align: start; color: var(--km-mut); }
.km-reason { font-size: 12px; color: var(--km-mut); text-align: center; margin-top: 6px; line-height: 1.6; }
.km-boutlist { margin-top: 8px; border-top: 1px solid var(--km-bd); }
.km-boutrow { display: flex; justify-content: space-between; gap: 6px; padding: 4px 2px; font-size: 12px; border-bottom: 1px solid var(--km-bd); align-items: center; }
.km-boutrow span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.km-boutwin { color: var(--km-mut); font-size: 11px; }
.km-players { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.km-playerrow { display: flex; align-items: center; gap: 6px; }
.km-boutnum { font-size: 12px; color: var(--km-mut); min-width: 52px; }
.km-input { flex: 1; min-width: 0; border: 2px solid var(--km-bd); border-radius: 8px; padding: 8px; font-size: 13px; font-family: inherit; text-align: center; background: var(--km-bg); color: var(--km-tx); }
.km-input-aka { border-color: var(--km-aka); }
.km-input-ao { border-color: var(--km-ao); }
.km-setupbtns { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.km-note { font-size: 11px; color: var(--km-mut); margin-top: 8px; }
.km-kcard { background: #fff; border: 1px solid var(--km-bd); border-radius: 14px; padding: 10px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px; }
.km-klabel { font-size: 12px; color: var(--km-mut); }
.km-kcheck { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--km-tx); }
.km-ktime { text-align: center; font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
.km-kend { text-align: center; font-size: 13px; font-weight: 700; color: var(--km-aka); }
.km-kmsg { text-align: center; font-size: 13px; color: var(--km-mut); min-height: 18px; }
.km-khead { display: grid; grid-template-columns: 42px 1fr 1fr; gap: 5px; align-items: center; text-align: center; }
.km-khead span { color: var(--km-mut); font-size: 12px; white-space: nowrap; }
.km-ktot { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.km-ktotcell { text-align: center; border: 2px solid; border-radius: 12px; padding: 6px 2px; }
.km-ktotcell i { display: block; font-style: normal; font-size: 13px; font-weight: 700; }
.km-ktotcell b { display: block; font-size: 42px; line-height: 1.05; }
.km-ktot-aka { border-color: var(--km-aka); color: var(--km-aka); }
.km-ktot-ao { border-color: var(--km-ao); color: var(--km-ao); }
.km-ktot-win.km-ktot-aka { background: var(--km-aka); color: #fff; }
.km-ktot-win.km-ktot-ao { background: var(--km-ao); color: #fff; }
button:active { transform: scale(0.97); }
.km-kcompact { gap: 6px; padding: 8px; }
.km-kcompact .km-ktime { font-size: 28px; flex: 1; }
.km-krow { display: flex; gap: 6px; align-items: center; }
.km-krow > * { min-width: 0; }
.km-krow .km-seg { flex: 1.2; }
.km-krow .km-dark { padding: 7px 4px; }
.km-krow .km-btn { padding: 7px 4px; }
.km-krow .km-kcheck { flex: 1; font-size: 12px; white-space: nowrap; }
.km-kcompact .km-input { padding: 6px; }
.km-kcompact .km-ktot { margin-top: 4px; }
.km-kcompact .km-ktotcell b { font-size: 32px; }
.km-subtabs { margin-top: -2px; }
.km-subtabs .km-tab { font-size: 13px; padding: 6px 4px; color: var(--km-mut); }
.km-subtabs .km-tab.km-seg-on { color: #fff !important; }
.km-kplayers { font-size: 11px !important; }

</style>
</head>
<body>
<div id="root"></div>
